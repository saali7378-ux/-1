let ac;function beep(f,d,t){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const win=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*120));
const lose=()=>[220,160].forEach((f,i)=>setTimeout(()=>beep(f,.3,'sawtooth'),i*200));
function sc(){return `<div class="score">${S.teams.map((t,i)=>`<div class="team ${i===S.turn?'act':''}" style="--c:${t.c}"><b>${esc(t.name)}</b><span>${N(t.s)}</span></div>`).join('')}</div>`}
function render(){
 const a=$('app'),t=S.teams[S.turn];
 if(S.screen==='setup'){
  a.innerHTML=`<div class="scr"><div class="logo">⚔️ حرب الفصول</div><p class="sub">كل فريق يختار تحدّيه بنفسه، والمعرفة تنتصر! المعلم هو الذي يدير اللعبة.</p>
  <div class="card"><h2 style="text-align:center">كم عدد الفرق؟</h2><div class="row" style="margin-top:14px">${[2,3,4,5,6].map(n=>`<button class="btn gh cnt ${n===S.n?'on':''}" onclick="S.n=${n};render()">${N(n)}</button>`).join('')}</div>
  <div class="lbl">كم سؤالاً يجيب كل فريق؟</div><div class="row">${[2,3,4,5].map(n=>`<button class="btn gh cnt ${n===S.rounds?'on':''}" onclick="S.rounds=${n};render()">${N(n)}</button>`).join('')}</div>
  <div class="setup">${Array.from({length:S.n},(_,i)=>`<label style="--c:${COL[i]}">اسم الفريق ${N(i+1)}<input maxlength="18" value="${esc(S.names[i])}" oninput="S.names[${i}]=this.value"></label>`).join('')}</div>
  <div class="row"><button class="btn or" onclick="start()">▶ ابدأ المعركة</button></div></div></div>`;
 }else if(S.screen==='welcome'){
  a.innerHTML=`${sc()}<div class="scr card hero" style="--c:${t.c}"><div class="rnd">السؤال ${N(Math.floor(S.count/S.teams.length)+1)} من ${N(S.rounds)} لكل فريق</div>
  <p>أهلاً بكم في ساحة المعركة</p><div class="big">فريق ${esc(t.name)}</div><p>جاء دوركم! استعدوا للتحدي 🔥</p>
  <button class="btn or" style="font-size:1.5rem;padding:14px 40px" onclick="go('cat')">هيا نختار التحدي ◀</button></div>`;
 }else if(S.screen==='cat'){
  a.innerHTML=`${sc()}<div class="scr" style="--c:${t.c}"><div class="ttl">حان وقت اختيار التحدي!</div>
  <p class="ask">يا فريق <b>${esc(t.name)}</b>، اختاروا المجال اللي عاوزين تتنافسوا فيه</p>
  <div class="cats">${CATS.map((c,i)=>`<button class="cc" style="--c:${c.c}" onclick="pickCat(${i})"><i>${c.i}</i>${c.n}<small>اضغطوا للاختيار</small></button>`).join('')}</div></div>`;
 }else if(S.screen==='diff'){
  const c=CATS[S.cat];
  a.innerHTML=`${sc()}<div class="scr" style="--c:${t.c}"><div class="ttl">${c.i} اخترتم ${c.n}</div>
  <p class="ask">الآن اختاروا مستوى الصعوبة يا فريق <b>${esc(t.name)}</b></p>
  <div class="cats">${LV.map((l,i)=>`<button class="cc lvl" style="--c:${LC[i]}" onclick="pickDiff(${i})"><i>${['🌱','⚡','🔥'][i]}</i>${l}<div class="st">${N(PTS[i])} نقطة</div><div class="st">${'⭐'.repeat(i+1)}</div></button>`).join('')}</div>
  <div class="row" style="margin-top:20px"><button class="btn gh" onclick="go('cat')">▶ رجوع لتغيير المجال</button></div></div>`;
 }else if(S.screen==='q'){
  const c=CATS[S.cat],q=S.q,pts=PTS[S.diff],at=S.teams[S.act];let res='';
  if(S.phase==='pick'){
   res=`<div class="res" style="color:var(--rd)">${S.timeout?'⏰ انتهى الوقت!':'❌ إجابة خاطئة!'} هل يريد فريق آخر أن يجرّب؟ (الإجابة الصحيحة مخفية)<div class="row" style="margin-top:12px">${S.teams.map((x,i)=>S.tried.includes(i)?'':`<button class="btn" style="background:${x.c}" onclick="steal(${i})">${esc(x.name)}</button>`).join('')}<button class="btn gh" onclick="reveal()">لا أحد، اعرضوا الإجابة</button></div></div>`;
  }else if(S.phase==='reveal'){
   res=S.winner>=0?`<div class="res" style="color:var(--gr)">✅ إجابة صحيحة! ${esc(S.teams[S.winner].name)} يكسب ${N(pts)} نقطة</div>`:`<div class="res" style="color:var(--or)">لم يجب أحد إجابة صحيحة. الإجابة الصحيحة باللون الأخضر 👆</div>`;
   res+=`<div class="row" style="margin-top:14px"><button class="btn or" onclick="next()">التالي ◀</button></div>`;
  }
  a.innerHTML=`${sc()}<div class="scr card"><div class="qhead"><span>${c.i} ${c.n} · ${LV[S.diff]} · <b>${N(pts)} نقطة</b></span><span>الفريق: <b style="color:${at.c}">${esc(at.name)}</b></span><span id="tm">${S.done?'':'⏱ '+N(S.time)}</span></div>
  <div class="bar"><div id="bar" style="width:${S.done?0:S.time/20*100}%"></div></div>
  <div class="q">${esc(q[0])}</div>
  <div class="opts">${q[1].map((o,i)=>`<button class="opt ${S.phase==='reveal'&&i===q[2]?'ok':''} ${S.wrong.includes(i)?'no':''}" ${S.done||S.wrong.includes(i)?'disabled':''} onclick="answer(${i})">${L[i]}. ${esc(o)}</button>`).join('')}</div>${res}</div>`;
 }else{
  const r=[...S.teams].sort((a,b)=>b.s-a.s);
  a.innerHTML=`<div class="scr"><div class="logo">🏆 النصر</div><p class="sub">${r[0].s===r[1].s?'تعادل في الصدارة!':'الفريق الفائز بحرب الفصول: '+esc(r[0].name)+' 🎉'}</p>
  <div class="pod">${r.map((t,i)=>`<div class="${i===0?'w':''}" style="--c:${t.c};min-height:${140-i*14}px"><div style="font-size:2rem">${['🥇','🥈','🥉'][i]||'🎖️'}</div>${esc(t.name)}<br><span style="font-size:2rem;font-weight:900;color:${t.c}">${N(t.s)}</span><div style="font-size:.9rem;color:var(--mu)">نقطة</div></div>`).join('')}</div>
  <div class="row"><button class="btn or" onclick="start()">↻ العب مرة أخرى</button><button class="btn gh" onclick="go('setup')">فرق جديدة</button></div></div>`;
  win();
 }
}
function go(s){S.screen=s;render()}
function start(){S.teams=Array.from({length:S.n},(_,i)=>({name:(S.names[i]||'').trim()||'الفريق '+N(i+1),c:COL[i],s:0}));S.turn=0;S.count=0;go('welcome')}
function pickCat(i){S.cat=i;go('diff')}
function pickDiff(d){
 S.diff=d;const k=S.cat+'-'+d,bank=CATS[S.cat].q[d];
 let used=S.usedQ[k]||(S.usedQ[k]=[]);
 let pool=bank.map((_,i)=>i).filter(i=>!used.includes(i));
 if(!pool.length){used.length=0;pool=bank.map((_,i)=>i)}
 const i=pool[Math.floor(Math.random()*pool.length)];used.push(i);
 S.q=bank[i];S.wrong=[];S.tried=[];S.winner=-1;S.timeout=false;S.act=S.turn;S.screen='q';startT()}
function startT(){S.phase='play';S.done=false;S.time=20;render();clearInterval(S.tm);S.tm=setInterval(()=>{S.time--;const e=$('tm');if(e)e.textContent='⏱ '+N(S.time);const b=$('bar');if(b)b.style.width=S.time/20*100+'%';if(S.time<=5&&S.time>0)beep(880,.05);if(S.time<=0)answer(-1)},1000)}
function answer(i){if(S.done)return;clearInterval(S.tm);S.done=true;if(i===S.q[2]){S.teams[S.act].s+=PTS[S.diff];S.winner=S.act;S.phase='reveal';win()}else{lose();S.timeout=i<0;if(i>=0)S.wrong.push(i);S.tried.push(S.act);S.phase=S.tried.length>=S.teams.length?'reveal':'pick'}render()}
function reveal(){S.phase='reveal';S.done=true;render()}
function steal(i){S.act=i;startT()}
function next(){clearInterval(S.tm);S.count++;if(S.count>=S.teams.length*S.rounds)return go('end');S.turn=(S.turn+1)%S.teams.length;go('welcome')}
render();
</script></body></html>
